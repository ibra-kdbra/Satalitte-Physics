name: Satellite data

# Refreshes data/satellites/ from CelesTrak (free public GP data) so the site can
# show real satellites without calling CelesTrak from every visitor's browser.
on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours (CelesTrak asks for at most every 2 h)
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch-satellites.mjs
      - .github/workflows/satellites.yml

permissions:
  contents: write

concurrency:
  group: satellite-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch element sets
        run: node scripts/fetch-satellites.mjs
      - name: Commit changes
        run: |
          git add data/satellites
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "Ibrakadabra"
          git config user.email "135609275+ibra-kdbra@users.noreply.github.com"
          git commit -m "Update satellite data from CelesTrak"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
