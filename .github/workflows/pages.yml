name: Deploy to GitHub Pages

# Publishes the site to GitHub Pages together with fresh satellite data from
# CelesTrak (free public GP data). The data is fetched at deploy time and is
# never committed, so the repository history stays small.
# Requires: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'   # refresh the satellite data every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Physics tests
        run: node --test tests/*.test.mjs
      - id: pages
        uses: actions/configure-pages@v5
      - name: Fetch satellite data (falls back to the deployed copy per group)
        run: node scripts/fetch-satellites.mjs --fallback "${{ steps.pages.outputs.base_url }}/data/satellites/"
      - name: Stamp the service worker's asset version (hash of assets/ and vendor/)
        run: |
          v=$(git ls-files -s assets vendor | sha256sum | cut -c1-12)
          sed -i "s/^const ASSET_VERSION = 'dev';/const ASSET_VERSION = '$v';/" sw.js
          grep -q "ASSET_VERSION = '$v'" sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
