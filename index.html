<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Satalitte Physics · Earth–Moon orbital mechanics sandbox</title>
  <meta name="description" content="Launch satellites, fly burns and watch real Newtonian gravity, the Moon's pull, J2 and atmospheric drag shape their orbits. An interactive Earth–Moon orbital mechanics sandbox in your browser.">
  <meta name="theme-color" content="#07090d">
  <meta name="color-scheme" content="dark">
  <meta name="author" content="Ibrakadabra (ibra-kdbra)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Satalitte Physics">
  <meta property="og:description" content="Interactive Earth–Moon orbital mechanics sandbox: orbits, gravity, drag, Hohmann transfers and Newton's cannon.">
  <meta property="og:site_name" content="Satalitte Physics">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307090d'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%231f6fc0'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='5' fill='none' stroke='%235ec4dd' stroke-width='1.8' transform='rotate(-28 16 16)'/%3E%3Ccircle cx='26.4' cy='10.2' r='2.2' fill='%235ec4dd'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles/main.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.min.js",
        "three/addons/": "./vendor/three/addons/",
        "lil-gui": "./vendor/lil-gui/lil-gui.esm.min.js"
      }
    }
  </script>
  <!-- Critical path: fetch the engine in parallel with main.js instead of after it.
       (Preloading the textures too was measured slower: they compete with the scripts.) -->
  <link rel="modulepreload" href="./vendor/three/build/three.module.min.js">
  <link rel="modulepreload" href="./vendor/three/build/three.core.min.js">
</head>
<body>
  <div id="viewport" aria-label="3D view of the Earth–Moon system" role="application"></div>
  <div id="ui"></div>

  <div id="loader" class="loader">
    <div class="loader__card">
      <div class="loader__brand"><svg class="logo" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><circle cx="16" cy="16" r="8.2" fill="#1f6fc0"/><ellipse cx="16" cy="16" rx="14" ry="5.6" fill="none" stroke="#5ec4dd" stroke-width="1.6" transform="rotate(-28 16 16)"/><circle cx="27.6" cy="9.8" r="2.1" fill="#e6f7ff"/></svg><span class="loader__name">Satalitte Physics</span></div>
      <div class="loader__bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="loader__fill"></span></div>
      <p class="loader__label">Loading…</p>
    </div>
  </div>

  <div id="fatal" class="fatal" hidden>
    <div class="fatal__card" role="alert">
      <h2 class="fatal__title">3D graphics are not available</h2>
      <p class="fatal__msg">WebGL is not available in this browser, so the simulation cannot run.</p>
      <ul class="fatal__tips">
        <li>Turn on hardware acceleration in your browser settings.</li>
        <li>Update your graphics drivers, or try another browser.</li>
      </ul>
      <div class="fatal__actions"><a class="btn" href="./legacy/index.html">Open the classic version</a></div>
    </div>
  </div>

  <noscript>
    <div class="fatal">
      <div class="fatal__card">
        <h2 class="fatal__title">JavaScript is turned off</h2>
        <p class="fatal__msg">Satalitte Physics is an interactive simulation and needs JavaScript. Please enable it and reload the page.</p>
      </div>
    </div>
  </noscript>

  <script type="module" src="./src/main.js" onerror="(function(){var l=document.getElementById('loader');if(l)l.hidden=true;var f=document.getElementById('fatal');if(!f)return;f.querySelector('.fatal__title').textContent='The simulation could not start';f.querySelector('.fatal__msg').textContent='The application scripts failed to load. Check your connection and reload the page.';var t=f.querySelector('.fatal__tips');if(t)t.hidden=true;f.hidden=false;})()"></script>
</body>
</html>
